[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devils-advocate"
version = "0.1.0"
description = "Argues against your legal position with Swiss Federal Supreme Court precedent, and shows a quote only if it is verbatim in the cited Erwägung."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sicofit" }]
keywords = ["legal", "rag", "llm", "swiss-law", "case-law", "evaluation"]
dependencies = ["numpy>=1.26", "pyarrow>=15", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
devils-advocate = "devils_advocate.cli:main"
devil = "devils_advocate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devils_advocate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# A whitespace-separated word list reads better than a 150-item list literal.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["devils_advocate"]
known-local-folder = ["conftest", "fakes"]

[tool.ruff.lint.per-file-ignores]
# The synthetic decisions keep the scrape's one-line paragraphs.
"tests/fakes.py" = ["E501"]
